# CMF Phone 1 (A015 / Tetris, mt6878) - earpiece as second speaker
#
# Verified working on Nothing OS B4.1-260615-1652, Android 16.
#
# Why these three, in this order:
#
# On this device the media path never touches the internal codec. Playback
# goes DL_24CH -> I2SOUT4 -> Awinic aw_dev_0 smart PA -> bottom speaker. The
# earpiece hangs off the internal codec's DAC (ADDA_DL), which normally has
# no source connected at all - which is why simply pointing RCV Mux at the
# receiver produces silence.
#
#   1. Handset Volume            earpiece gain, set BEFORE it is driven
#   2. ADDA_DL_CH1 DL_24CH_CH1   feed the internal DAC from the same stream
#                                that is already going to the speaker
#   3. RCV Mux = Voice Playback  route that DAC to the earpiece
#
# Order matters: connect the feed before opening the mux, so the receiver is
# never pointed at an undefined path.

ctl|Handset Volume|0
ctl|ADDA_DL_CH1 DL_24CH_CH1|1
ctl|RCV Mux|Voice Playback

# ---- gain -------------------------------------------------------------
# Handset Volume is the receiver amp's gain on the MT6369 codec. From the
# codec driver (snd-soc-mt6369.ko): range 0-18, and the register runs the
# opposite way to the ALSA dB scale it advertises -
#
#   0 = +8 dB (loudest)   8 = 0 dB   18 = -10 dB   31 = -40 dB (mute)
#
# 31 is the codec's idle/mute value (every output reads 31 at rest, and the
# driver's put handler special-cases it), and the HAL itself sets 0 whenever
# it drives the receiver. Earlier revisions shipped 31 believing it was the
# top, so the daemon pulled the earpiece down to -40 dB every cycle while the
# HAL kept putting it back to +8 dB - the "Handset Volume: 0 -> 31" storm in
# the log, and the reason the earpiece sounded weak and uneven.
#
# 0 matches the HAL and is the receiver's maximum. Raise the number (towards
# 18) to make the earpiece quieter. The receiver has no protection circuit:
# back off at the first buzz or rattle.
#
# ADDA_DL_GAIN (digital, before the DAC) is deliberately NOT set: the HAL
# already parks it at 63311 of 65535 (-0.3 dB), and ADDA_DL is shared with
# the headphone path.

# ---- channels ----------------------------------------------------------
# Measured (full table in README, Findings):
#
#   speaker   the Awinic amp picks its I2S slot itself: register 0x06 bits
#             11:10 (01 left = stock 0x34e8, 10 right = 0x38e8). On the right
#             slot, cutting I2SOUT4_CH2 silences it, so the routing and the
#             amp can both carry a separate channel.
#   earpiece  RCV <- ADDA_DL_CH1 <- DL_24CH_CH1; ADDA_DL_CH1 has no CH2 source.
#
# What makes it mono is upstream: the MediaTek HAL averages L+R for a
# single speaker (doStereoToMonoConversionIfNeed), and Awinic's speaker
# protection on the audio DSP (Aurisys smartpa_awinic) does the same. Both
# are switched off by 'stereoctl channels stereo' (README, Mono and stereo);
# these actions are the same in either mode - the earpiece always takes
# DL_24CH_CH1, the left channel.
#
# 'stereoctl xml-patch' is a no-op here: the policy already declares a
# stereo speaker port.
