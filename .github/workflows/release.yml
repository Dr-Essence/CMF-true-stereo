name: Release

# Runs the off-device tests, builds the flashable zip and publishes it as a
# GitHub release tagged with module.prop's version - either by pushing that
# tag, or by running this workflow by hand (it then creates the tag on the
# commit it built). A pushed tag must match module.prop, so a release can
# never carry the wrong version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: sh tests/run-tests.sh

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER=$(grep '^version=' module.prop | cut -d= -f2-)
          [ "$VER" = "${GITHUB_REF_NAME}" ] || { echo "module.prop says $VER, tag is ${GITHUB_REF_NAME}"; exit 1; }

      - name: Build
        run: |
          VER=$(grep '^version=' module.prop | cut -d= -f2-)
          ./build.sh "CMF-true-stereo-$VER.zip"
          echo "ZIP=CMF-true-stereo-$VER.zip" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"
          NOTES=docs/releases/$VER.md
          if [ ! -f "$NOTES" ]; then
            NOTES=release-body.md
            cat > "$NOTES" <<'BODY'
          Flash in Magisk / KernelSU / APatch, reboot. CMF Phone 1 (A015) only;
          on other phones it installs inert.

          **Mono** (default): both speakers play the full mix, with Awinic speaker protection.
          **Stereo**: `stereoctl channels stereo`, reboot. Earpiece left, speaker right.
          Read the README's *Mono and stereo* section first: stereo turns Awinic's
          speaker protection off for media and holds a fixed amp attenuation instead.

          Companion app: [CMF-true-stereo-manager](https://github.com/Dr-Essence/CMF-true-stereo-manager/releases)
          BODY
          fi
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: module
          path: ${{ env.ZIP }}

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: CMF-true-stereo ${{ env.VER }}
          # docs/releases/<version>.md when it exists (the Release notes
          # workflow keeps it in sync afterwards), else the generic text.
          body_path: ${{ env.NOTES }}
          files: ${{ env.ZIP }}
