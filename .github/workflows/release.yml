name: Release

# Runs the off-device tests, builds the flashable zip and publishes it as a
# GitHub release tagged with module.prop's version - either by pushing that
# tag, or by running this workflow by hand (it then creates the tag on the
# commit it built). A pushed tag must match module.prop, so a release can
# never carry the wrong version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: sh tests/run-tests.sh

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER=$(grep '^version=' module.prop | cut -d= -f2-)
          [ "$VER" = "${GITHUB_REF_NAME}" ] || { echo "module.prop says $VER, tag is ${GITHUB_REF_NAME}"; exit 1; }

      - name: Build
        run: |
          VER=$(grep '^version=' module.prop | cut -d= -f2-)
          ./build.sh "CMF-true-stereo-$VER.zip"
          echo "ZIP=CMF-true-stereo-$VER.zip" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"
          NOTES=docs/releases/$VER.md
          if [ ! -f "$NOTES" ]; then
            NOTES=release-body.md
            cat > "$NOTES" <<'BODY'
          Flash in Magisk / KernelSU / APatch, reboot. CMF Phone 1 (A015) only;
          on other phones it installs inert.

          **Mono** (default): both speakers play the full mix, with Awinic speaker protection.
          **Stereo**: `stereoctl channels stereo`, reboot. Earpiece left, speaker right.
          Read the README's *Mono and stereo* section first: stereo turns Awinic's
          speaker protection off for media and holds a fixed amp attenuation instead.

          Companion app: [CMF-true-stereo-manager](https://github.com/Dr-Essence/CMF-true-stereo-manager/releases)
          BODY
          fi
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"

      # The stereo test files, rebuilt from tools/make-test-audio.py (fixed
      # seeds) and attached so anyone can check left and right themselves.
      - name: Test audio
        run: |
          sudo apt-get install -y -qq espeak-ng >/dev/null
          python3 -m pip install -q numpy
          python3 tools/make-test-audio.py test-audio
          ls -l test-audio

      # SHA-256 of everything attached, as a file and in the description, so
      # anyone can check a download is the file published here.
      - name: Checksums
        run: |
          sha256sum "$ZIP" test-audio/LEFT_ONLY_3min.wav test-audio/LEFT10s_RIGHT10s.wav \
            | sed 's#  .*/#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cp "$NOTES" release-body-final.md
          { echo; echo '### Checksums (SHA-256)'; echo '```'; cat SHA256SUMS.txt; echo '```'; } >> release-body-final.md
          echo "NOTES=release-body-final.md" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: module
          path: ${{ env.ZIP }}

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: CMF-true-stereo ${{ env.VER }}
          # docs/releases/<version>.md when it exists (the Release notes
          # workflow keeps it in sync afterwards), else the generic text.
          body_path: ${{ env.NOTES }}
          files: |
            ${{ env.ZIP }}
            test-audio/LEFT_ONLY_3min.wav
            test-audio/LEFT10s_RIGHT10s.wav
            SHA256SUMS.txt

      # Magisk / KernelSU / APatch read update.json (module.prop updateJson) to
      # offer the update. It moves to this version only now, after the
      # release and its zip exist.
      - name: Update link
        run: |
          CODE=$(grep '^versionCode=' module.prop | cut -d= -f2)
          git fetch -q origin main && git checkout -q -B main origin/main
          cat > update.json <<JSON
          {
            "version": "$VER",
            "versionCode": $CODE,
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/$VER/$ZIP",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/docs/releases/$VER.md"
          }
          JSON
          cat update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -q -m "update.json: $VER" && git push -q origin HEAD:main || echo "update.json unchanged"
