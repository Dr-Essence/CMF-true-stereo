name: Release notes

# The notes for a release live in docs/releases/<tag>.md. Editing one on main
# rewrites that release's description, so notes can be fixed after the
# release without touching the files attached to it.
on:
  push:
    branches: [main]
    paths: ['docs/releases/*.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in docs/releases/*.md; do
            tag=$(basename "$f" .md)
            if gh release view "$tag" >/dev/null 2>&1; then
              # Keep the checksums the release workflow published.
              cp "$f" "$RUNNER_TEMP/notes.md"
              if gh release download "$tag" -p SHA256SUMS.txt -O "$RUNNER_TEMP/sums.txt" 2>/dev/null; then
                { echo; echo '### Checksums (SHA-256)'; echo '```'; cat "$RUNNER_TEMP/sums.txt"; echo '```'; } >> "$RUNNER_TEMP/notes.md"
              fi
              gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md" && echo "updated $tag"
            else
              echo "no release $tag yet - skipped"
            fi
          done
